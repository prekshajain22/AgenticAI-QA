[pytest]

testpaths = tests

addopts = -v --html=output/reports/test_report.html --self-contained-html --reruns 2 --reruns-delay 1

python_files = test_*.py

bdd_features_base_dir = tests/features

markers =
    smoke: critical smoke tests
    regression: full regression tests
    integration: tests that require external services (JIRA, OpenAI, etc.) — excluded from CI
