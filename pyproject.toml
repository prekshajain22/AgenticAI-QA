[project]
name = "agenticai-qa"
version = "0.1.0"
description = "Playwright + Pytest BDD QA automation framework with AI failure analysis"
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies are pinned in requirements.txt.
# For an editable install: pip install -e .
dependencies = []

[project.optional-dependencies]
dev = [
    # Web framework & HTTP
    "flask==3.1.3",
    "requests==2.34.2",
    "python-dotenv==1.2.2",
    # Playwright UI automation
    "playwright==1.62.0",
    "pytest==9.1.1",
    "pytest-playwright==0.8.0",
    "pytest-bdd==8.1.0",
    "pytest-html==4.2.0",
    "pytest-json-report==1.5.0",
    "pytest-rerunfailures==16.4",
    "pytest-xdist==3.8.0",
    # Reporting
    "reportlab==5.0.0",
    # AI
    "autogen-agentchat==0.7.5",
    "autogen-core==0.7.5",
    "autogen-ext==0.7.5",
    "httpx",
    # Code quality
    "ruff==0.15.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai*", "automation*", "config*", "service*"]

[tool.ruff]
line-length = 100
exclude = [
    ".venv",
    "__pycache__",
    "reports",
    ".git"
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I"
]

[tool.ruff.lint.per-file-ignores]
"conftest.py" = ["E402"]
"tests/unit/*" = ["S101"]
"tests/integration/*" = ["S101"]
