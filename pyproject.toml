[project]
name = "agenticai-qa"
version = "0.1.0"
description = "Playwright + Pytest BDD QA automation framework with AI failure analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.1.3",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "playwright==1.62.0",
    "pytest==9.1.1",
    "pytest-playwright==0.8.0",
    "pytest-bdd==8.1.0",
    "pytest-html==4.2.0",
    "pytest-json-report==1.5.0",
    "pytest-rerunfailures==16.4",
    "pytest-xdist==3.8.0",
    "reportlab==5.0.0",
    "autogen-agentchat==0.7.5",
    "autogen-core==0.7.5",
    "autogen-ext[openai,mcp]==0.7.5",
    "mcp<2.0.0",
    "google-genai>=2.17.0",
    "httpx",
    "openai",
    "python-frontmatter",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.20"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "automation*", "config*", "service*"]

[tool.setuptools.package-data]
agents = ["specs/*.md"]

[tool.ruff]
line-length = 100
exclude = [
    ".venv",
    "__pycache__",
    "reports",
    ".git"
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I"
]

[tool.ruff.lint.per-file-ignores]
"conftest.py" = ["E402"]
"tests/unit/*" = ["S101"]
